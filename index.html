<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17172b">
  <title>震動枕頭鬧鐘</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #17172b; color: white; font: 18px system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 28px; border-radius: 24px; background: #252541; box-shadow: 0 20px 60px #0005; }
    h1 { margin-top: 0; font-size: 28px; }
    input, button { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; font: inherit; }
    input { background: #fff; color: #17172b; }
    button { background: #b4a2ff; color: #17172b; font-weight: 700; cursor: pointer; }
    #test { background: #41435f; color: white; }
    #stop { display: none; background: #d94f68; color: white; }
    #status { min-height: 2em; color: #d8d0ff; line-height: 1.5; }
    small { color: #c5c6d6; line-height: 1.5; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>🔔 震動枕頭鬧鐘</h1>
    <p>設定提醒時間，試試安靜的震動鬧鐘。</p>
    <label for="time">鬧鐘時間</label>
    <input id="time" type="time">
    <button id="set">設定鬧鐘</button>
    <button id="test">測試震動</button>
    <button id="stop">停止鬧鐘</button>
    <p id="status" role="status">尚未設定鬧鐘。</p>
    <small>提醒：網頁需保持開啟；手機鎖定或切到背景時，鬧鐘可能不會準時觸發。此功能使用手機本身的震動器。iPhone、iPad 的 Safari 通常不支援網頁震動。</small>
  </main>
  <script>
    const timeInput = document.querySelector('#time');
    const statusText = document.querySelector('#status');
    let alarmTimer;
    let vibrationTimer;

    document.querySelector('#set').addEventListener('click', () => {
      clearTimeout(alarmTimer);
      const value = timeInput.value;
      if (!value) {
        statusText.textContent = '請先選擇鬧鐘時間。';
        return;
      }
      const [hour, minute] = value.split(':').map(Number);
      const now = new Date();
      const alarm = new Date();
      alarm.setHours(hour, minute, 0, 0);
      if (alarm <= now) alarm.setDate(alarm.getDate() + 1);
      alarmTimer = setTimeout(ring, alarm.getTime() - now.getTime());
      statusText.textContent = `鬧鐘已設定：${value}。請保持此頁開啟。`;
    });

    function ring() {
      document.querySelector('#stop').style.display = 'block';
      if ('vibrate' in navigator) {
        navigator.vibrate([600, 300, 600, 300, 1000]);
        vibrationTimer = setInterval(() => navigator.vibrate([600, 300, 600, 300, 1000]), 3000);
        statusText.textContent = '時間到！鬧鐘正在震動。';
      } else {
        statusText.textContent = '此裝置或瀏覽器不支援網頁震動。';
      }
    }

    document.querySelector('#test').addEventListener('click', () => {
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 150, 200]);
        statusText.textContent = '已送出震動測試。';
      } else {
        statusText.textContent = '這個瀏覽器或裝置不支援震動。';
      }
    });

    document.querySelector('#stop').addEventListener('click', () => {
      clearInterval(vibrationTimer);
      if ('vibrate' in navigator) navigator.vibrate(0);
      document.querySelector('#stop').style.display = 'none';
      statusText.textContent = '鬧鐘已停止。';
    });
  </script>
</body>
</html>
